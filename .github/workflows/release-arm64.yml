name: Build signed ARM64 release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: RustClipSync release version name
        required: true
        default: 0.1.4
      publish_release:
        description: Publish the verified APK to GitHub Releases
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_ABI: arm64-v8a
      BUILD_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Check required signing configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z ${!name:-} ]]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done
      - name: Fetch source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;28.0.13004108' 'cmake;3.31.6'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build release APK and run sync unit tests
        run: >-
          ./gradlew :app:assembleRelease :app:testDebugUnitTest
          --tests 'org.fcitx.fcitx5.android.rustclipsync.*'
          --no-daemon --console=plain
      - name: Sign and verify release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"
          umask 077
          keystore="$RUNNER_TEMP/rustclipsync-release.p12"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*-unsigned.apk)
          test "${#apks[@]}" -eq 1
          tools="$ANDROID_HOME/build-tools/36.1.0"
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          mkdir -p release-output
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out release-output/rustclipsync-android-arm64-release.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs release-output/rustclipsync-android-arm64-release.apk
          "$tools/aapt" dump badging release-output/rustclipsync-android-arm64-release.apk > "$RUNNER_TEMP/release-badging.txt"
          grep -E "^package: name='org\\.fcitx\\.fcitx5\\.android' " "$RUNNER_TEMP/release-badging.txt"
          grep -F "versionName='${BUILD_VERSION_NAME}'" "$RUNNER_TEMP/release-badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/release-badging.txt"
          (cd release-output && sha256sum rustclipsync-android-arm64-release.apk > SHA256SUMS)
      - name: Upload signed release APK
        uses: actions/upload-artifact@v5
        with:
          name: rustclipsync-android-arm64-release-${{ github.sha }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]
          tools="$ANDROID_HOME/build-tools/36.1.0"
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -n "$previous" ]]; then
            old="$RUNNER_TEMP/previous-release"
            mkdir -p "$old"
            gh release download "$previous" --pattern rustclipsync-android-arm64-release.apk --dir "$old"
            "$tools/apksigner" verify --print-certs "$old/rustclipsync-android-arm64-release.apk" > "$RUNNER_TEMP/previous-certificate.txt"
            "$tools/apksigner" verify --print-certs release-output/rustclipsync-android-arm64-release.apk > "$RUNNER_TEMP/new-certificate.txt"
            old_signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/previous-certificate.txt")
            new_signer=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-certificate.txt")
            [[ -n "$old_signer" && "$old_signer" == "$new_signer" ]]
            old_code=$("$tools/aapt" dump badging "$old/rustclipsync-android-arm64-release.apk" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            new_code=$("$tools/aapt" dump badging release-output/rustclipsync-android-arm64-release.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            [[ "$old_code" =~ ^[0-9]+$ && "$new_code" =~ ^[0-9]+$ ]]
            (( new_code > old_code ))
            echo "Upgrade verified: same signing certificate; versionCode $old_code -> $new_code"
          fi
          gh release create "$BUILD_VERSION_NAME" \
            release-output/rustclipsync-android-arm64-release.apk release-output/SHA256SUMS \
            --draft \
            --target "$GITHUB_SHA" --title "RustClipSync Android $BUILD_VERSION_NAME" \
            --notes-file "releases/$BUILD_VERSION_NAME.md"
          verify="$RUNNER_TEMP/published-apk-check"
          gh release download "$BUILD_VERSION_NAME" --dir "$verify"
          cmp release-output/SHA256SUMS "$verify/SHA256SUMS"
          (cd "$verify" && sha256sum --check SHA256SUMS)
          gh release edit "$BUILD_VERSION_NAME" --draft=false --latest
